</style></head><body><div class="c"><canvas id="cv" width="1200" height="630"></canvas>
<div class="t"><div class="k">Teste gratuito · 20 minutos</div><h1>Qual é o<em>meu rumo?</em></h1>
<p>Descubra o que combina com você e teste na prática em 30 dias.</p><div class="pill">Fazer o teste</div></div></div>
<script>
const c=document.getElementById('cv').getContext('2d');const W=1200,H=630,cx=W*.8,cy=H*.38,step=W*.045;
c.strokeStyle='rgba(29,106,79,.2)';
for(let k=1;k<=18;k++){c.lineWidth=k%5===0?3:1.6;c.beginPath();for(let s=0;s<=160;s++){const a=s/160*Math.PI*2;const w=1+.13*Math.sin(3*a+k*.55)+.07*Math.sin(5*a-k*.35)+.04*Math.cos(7*a+k*.9);const x=cx+Math.cos(a)*k*step*w*1.3,y=cy+Math.sin(a)*k*step*w*.85;s?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();c.stroke()}
c.strokeStyle='#D5960A';c.fillStyle='#D5960A';c.lineWidth=6;c.beginPath();c.moveTo(cx,cy+34);c.lineTo(cx,cy-54);c.stroke();
c.beginPath();c.moveTo(cx,cy-54);c.lineTo(cx+50,cy-36);c.lineTo(cx,cy-18);c.closePath();c.fill();c.beginPath();c.arc(cx,cy+34,9,0,Math.PI*2);c.fill();
