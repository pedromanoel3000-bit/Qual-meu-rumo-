<style>
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-700.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-800.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/plex-mono-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/plex-mono-600.woff2) format("woff2")}
/* base */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: caderneta de campo. Uma trilha de 5 marcos fixa no topo; abaixo, um cartão por vez numa coluna de até 600px. Placas de trilha (fonte condensada) para títulos. */
:root{
  --bg:#EDF2EC; --paper:#F9FBF7; --ink:#15241E; --muted:#56675E; --line:#C9D5CB;
  --accent:#1D6A4F; --accent-ink:#F6FBF8; --accent-soft:#D9EADF;
  --marker:#D5960A; --marker-soft:#F7E6B8; --marker-ink:#3D2A00;
  --warn:#8A5200; --warn-soft:#FBEBCB;
  --contour:rgba(29,106,79,.17);
  --t-R:#A65A2A; --t-I:#2C5D9C; --t-A:#A93C83; --t-S:#2A8664; --t-E:#B07804; --t-C:#5A55A0;
  --shadow:0 1px 0 rgba(21,36,30,.05),0 10px 26px -16px rgba(21,36,30,.28);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1613; --paper:#14201B; --ink:#E3ECE6; --muted:#97A99F; --line:#2C3D35;
    --accent:#5DC39B; --accent-ink:#06120D; --accent-soft:#183428;
    --marker:#F1B738; --marker-soft:#3A2D0F; --marker-ink:#FFF1CC;
    --warn:#F2B45C; --warn-soft:#382810;
    --contour:rgba(93,195,155,.14);
    --t-R:#E3915F; --t-I:#82AAEA; --t-A:#E482C2; --t-S:#5DC39B; --t-E:#F1B738; --t-C:#A9A4EE;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1613; --paper:#14201B; --ink:#E3ECE6; --muted:#97A99F; --line:#2C3D35;
  --accent:#5DC39B; --accent-ink:#06120D; --accent-soft:#183428;
  --marker:#F1B738; --marker-soft:#3A2D0F; --marker-ink:#FFF1CC;
  --warn:#F2B45C; --warn-soft:#382810;
  --contour:rgba(93,195,155,.14);
  --t-R:#E3915F; --t-I:#82AAEA; --t-A:#E482C2; --t-S:#5DC39B; --t-E:#F1B738; --t-C:#A9A4EE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.trail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);list-style:none;margin:0;padding:0}
.trail::before{content:"";position:absolute;top:7px;left:10%;right:10%;border-top:2px dashed var(--line)}
.wp{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wp i{width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:block}
.wp.done i{background:var(--accent);border-color:var(--accent)}
.wp.now i{background:var(--marker);border-color:var(--marker);box-shadow:0 0 0 4px var(--marker-soft)}
.wp span{font:600 10px/1.1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.wp.now span{color:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font:500 12px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);transition:width .25s ease}

/* Estrutura */
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.foot{max-width:600px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:14px}
.foot a,.small a,.note a{color:var(--muted);font-weight:700;text-underline-offset:3px}
.foot a:hover,.small a:hover,.note a:hover{color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.enter{animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.kicker{font:600 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q{font-size:clamp(22px,5.6vw,28px);line-height:1.25;font-weight:700;text-wrap:balance}
.lead{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);padding:28px 20px 22px;display:flex;flex-direction:column;gap:14px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas){position:relative}
.display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.01em}
.hero h1{font-size:clamp(46px,13.5vw,80px)}
.hero h1 em{font-style:normal;color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font:600 13px/26px var(--f-mono);text-align:center}
.steps b{display:block}
.steps small{color:var(--muted);font-size:14px}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:12px}
.sample .letters{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.06em}

/* Campos */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
.input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);color:var(--ink)}
textarea{min-height:104px;resize:vertical;line-height:1.45}
.input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:50px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.wide{width:100%}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:8px 2px;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* Opções */
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-weight:700;min-height:54px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:inline-flex;gap:4px;flex:none}
.dots u{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.dots u.on{background:var(--accent);border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.or{align-self:center;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.choice{display:flex;align-items:flex-end;min-height:128px;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700;font-size:18px;line-height:1.3;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:480px){.pair{grid-template-columns:1fr}.or{justify-self:center}.choice{min-height:84px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rq{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.rq+.rq{border-top:1px solid var(--line);padding-top:16px}
.rq>p{font-weight:700}

/* Resultado */
.sec{display:flex;flex-direction:column;gap:14px}
.sec h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:32px;line-height:.95;letter-spacing:.01em}
.code{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.code span{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,20vw,104px);line-height:.9}
.code i{font-style:normal;font-family:var(--f-display);font-size:40px;color:var(--line)}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:118px 1fr 44px;gap:10px;align-items:center}
.brow .nm{font-weight:700;font-size:15px;min-width:0}
.brow .tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.brow .tr b{display:block;height:100%;border-radius:6px}
.brow .pc{font:600 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.types{display:grid;gap:12px}
.type{padding-left:14px;border-left:4px solid var(--c)}
.type b{display:block}
.path{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper);display:flex;flex-direction:column;gap:12px;min-width:0}
.path.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;line-height:.95;min-width:0}
.rank{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:4px}
.aff{flex:none;font:600 13px/1 var(--f-mono);padding:8px 10px;border-radius:999px;background:var(--marker-soft);color:var(--marker-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--accent);list-style-position:inside}
details p{margin-top:8px}
details p b{display:block;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.minis{display:flex;flex-direction:column;gap:8px;margin-top:14px}
details.mini{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--paper);min-width:0}
details.mini.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
details.mini>summary{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--ink);list-style:none;min-height:52px}
details.mini>summary::-webkit-details-marker{display:none}
details.mini>summary::after{content:"+";flex:none;width:18px;text-align:center;font:600 20px/1 var(--f-mono);color:var(--accent)}
details.mini[open]>summary::after{content:"\2212"}
.mrank{flex:none;min-width:30px;font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.mname{flex:1;min-width:0;line-height:1.25}
.mbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.pick{align-self:flex-start;padding:10px 14px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weeks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.week{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.week h3{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.task{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding-block:6px}
.task input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.task.ok span{text-decoration:line-through;color:var(--muted)}
.matrix{display:flex;flex-direction:column;gap:14px}
.mx{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.mx.lead1{border-color:var(--marker);box-shadow:0 0 0 2px var(--marker) inset}
.mxh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mxh b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;line-height:1}
.mxh span{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.crit{display:grid;grid-template-columns:1fr 92px 22px;gap:10px;align-items:center;font-size:15px}
.crit input{width:100%;accent-color:var(--accent)}
.crit output{font:600 14px var(--f-mono);text-align:right}
.verdict{padding:14px;border-radius:12px;background:var(--marker-soft);color:var(--marker-ink);font-weight:700}
.qa{display:flex;flex-direction:column;gap:12px}
.qa div{border-left:3px solid var(--line);padding-left:12px}
.qa b{display:block;font-size:14px;color:var(--muted)}
.ask{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.copybox{width:100%;min-height:180px;font:13px/1.45 var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.more{border-top:0;padding-top:0}
.hero .btn{align-self:flex-start}
#sharesec{scroll-margin-top:110px}
.shareprev{display:flex;justify-content:center}
.shareprev img{width:min(62%,260px);height:auto;border-radius:14px;border:1px solid var(--line);background:var(--line);box-shadow:var(--shadow);display:block}
.print-only{display:none}
/* PDF / impressão: tema claro, sem botões, só o que interessa ler no papel */
@media print{
  :root:root:root{--bg:#fff;--paper:#fff;--ink:#15241E;--muted:#56675E;--line:#C9D5CB;--accent:#1D6A4F;--accent-ink:#F6FBF8;--accent-soft:#D9EADF;--marker:#D5960A;--marker-soft:#F7E6B8;--marker-ink:#3D2A00;--warn:#8A5200;--warn-soft:#FBEBCB;--contour:rgba(29,106,79,.17);--t-R:#A65A2A;--t-I:#2C5D9C;--t-A:#A93C83;--t-S:#2A8664;--t-E:#B07804;--t-C:#5A55A0;--shadow:none;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12pt}
  body::before,.top,.toast,.btn,.link,.pick,.nav,.noprint,.foot,#sharesec{display:none!important}
  .wrap{max-width:none;padding:0;gap:12px}
  .card,.hero,.path,.week,.mx{box-shadow:none}
  .path,.week,.mx,.type,.brow,.qa div,.verdict{break-inside:avoid}
  .sec h2,.ph,.kicker{break-after:avoid}
  summary{list-style:none;color:var(--ink)}
  summary::-webkit-details-marker{display:none}
  .print-only{display:block}
}
[tabindex="-1"]:focus{outline:none}
@media (max-width:420px){.wp span{font-size:9px;letter-spacing:.02em}}
@media (max-width:400px){.brow{grid-template-columns:108px 1fr 40px}.brow .nm{font-size:14px}.crit{grid-template-columns:1fr 80px 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
"use strict";
const TYPES = {
  R:{nome:"Realista", ap:"Mão na massa", desc:"Você gosta de coisas concretas: usar as mãos, ferramentas, o corpo, cuidar de plantas ou animais. Ver o resultado na hora te satisfaz."},

const CRIT = ["Me deu energia", "Tenho jeito para isso", "Cabe na minha vida", "Me vejo nisso em 5 anos"];
/* ---------- Estado ---------- */
const KEY = "rumo-v1";
const STAGES = [["int","Interesses"],["par","Escolhas"],["real","Realidade"],["refl","Reflexão"],["res","Resultado"]];
const STAGE_IDX = {int:0, par:1, real:2, refl:3, res:4};
function fresh(){
  return {v:1, step:"intro", i:0, last:"", li:0, name:"",
    int:Array(ITEMS.length).fill(null), par:Array(PAIRS.length).fill(null),
    real:{}, refl:Array(REFL.length).fill(""), picks:null, done:{}, sc:{}};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.v === 1) return Object.assign(fresh(), o); }
  }catch(e){}
  return fresh();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const app = document.getElementById("app");
const topEl = document.getElementById("top");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const complete = () => !S.int.includes(null) && !S.par.includes(null) && REAL.every(r => S.real[r.k] !== undefined);

function go(step, i){
  S.step = step; S.i = i || 0;
  if(step !== "intro"){ S.last = step; S.li = S.i; }
  save(); render();
  try{ window.scrollTo({top:0}); }catch(e){ window.scrollTo(0,0); }
}

/* ---------- Topo: trilha de marcos ---------- */
function progress(){
  const a = S.real ? Object.keys(S.real).length : 0;
  switch(S.step){
    case "int": return 0.45 * S.i / ITEMS.length;
    case "par": return 0.45 + 0.2 * S.i / PAIRS.length;
    case "real": return 0.65 + 0.15 * a / REAL.length;
    case "refl": return 0.8 + 0.2 * S.i / REFL.length;
    case "res": return 1;
    default: return 0;
  }
}
function renderTop(){
  const idx = STAGE_IDX[S.step];
  const lis = STAGES.map(([k,l],n) => {
    let c = "";
    if(idx !== undefined){ if(n < idx) c = "done"; else if(n === idx) c = "now"; }
    return `<li class="wp ${c}"><i></i><span>${l}</span></li>`;
  }).join("");
  let left = "", right = "";
  if(S.step === "intro"){ left = "4 etapas + resultado"; right = "15 a 20 min"; }
  else if(S.step === "int"){ left = "Etapa 1 · Interesses"; right = `${S.i+1} de ${ITEMS.length}`; }
  else if(S.step === "par"){ left = "Etapa 2 · Escolhas"; right = `${S.i+1} de ${PAIRS.length}`; }
  else if(S.step === "real"){ left = "Etapa 3 · Realidade"; right = `${Object.keys(S.real).length} de ${REAL.length}`; }
  else if(S.step === "refl"){ left = "Etapa 4 · Reflexão"; right = `${S.i+1} de ${REFL.length}`; }
  else { left = "Seu resultado"; right = S.name ? esc(S.name) : "Pronto"; }
  const pct = Math.round(progress() * 100);
  topEl.innerHTML = `<ol class="trail" aria-label="Etapas">${lis}</ol>
    <div class="meta"><span>${left}</span><span>${right}</span></div>
    <div class="bar" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><b style="width:${pct}%"></b></div>`;
}

function back(){

function fwd(){

  else if(S.step === "par"){ S.i < PAIRS.length - 1 ? go("par", S.i + 1) : go("real"); }
  else if(S.step === "refl"){ S.i < REFL.length - 1 ? go("refl", S.i + 1) : finish(); }
}
function firstNull(arr){ const k = arr.indexOf(null); return k < 0 ? 0 : k; }
function finish(){
  const firstInt = S.int.indexOf(null);

  const firstPar = S.par.indexOf(null);
  if(firstPar >= 0){ go("par", firstPar); return; }
  if(!REAL.every(r => S.real[r.k] !== undefined)){ go("real"); return; }
  if(!Array.isArray(S.picks) || !S.picks.length) S.picks = null;

}

/* ---------- Pontuação ---------- */
function typeScores(){
  const raw = {}, cnt = {};
  TORDER.forEach(t => { raw[t] = 0; cnt[t] = 0; });
  ITEMS.forEach(([t], k) => { const v = S.int[k]; if(v !== null){ raw[t] += v; cnt[t]++; } });
  const pct = {};
  TORDER.forEach(t => pct[t] = cnt[t] ? Math.round(100 * raw[t] / (3 * cnt[t])) : 0);
  return pct;
}
function codeOf(pct){
  return [...TORDER].sort((a, b) => pct[b] - pct[a] || TORDER.indexOf(a) - TORDER.indexOf(b)).slice(0, 3);
}
function chosenDims(){
  return PAIRS.map((p, k) => S.par[k] ? p[S.par[k]][1] : null).filter(Boolean);
}
function scorePaths(){
  const pct = typeScores(), code = codeOf(pct);
  const vals = TORDER.map(t => pct[t]), mn = Math.min(...vals), mx = Math.max(...vals);
  const rel = {};
  TORDER.forEach(t => rel[t] = mx > mn ? (pct[t] - mn) / (mx - mn) : 0.5);
  const dims = new Set(chosenDims());
  const R = S.real;
  return PATHS.map(p => {
    let w = 0, acc = 0;
    for(const t in p.rx){ w += p.rx[t]; acc += p.rx[t] * (0.6 * rel[t] + 0.4 * pct[t] / 100); }
    const ri = w ? acc / w : 0;
    const match = p.pre.filter(d => dims.has(d));
    const clash = p.pre.filter(d => dims.has(OPP[d])).length + p.con.filter(d => dims.has(d)).length;
    let vs = (match.length - 0.7 * clash) / Math.max(3, p.pre.length * 0.7);
    vs = Math.max(-1, Math.min(1, vs));
    const val = (vs + 1) / 2;
    const long = p.ent === "longo";
    let pen = 0; const warns = [], plus = [];
    if(p.fac && R.faculdade === 3){ pen += .3; warns.push("Exige faculdade"); }
    else if(p.fac && R.faculdade === 2){ pen += .15; warns.push("Exige faculdade"); }
    else if(long && R.faculdade >= 2){ pen += .08; }
    if(long && R.prazo === 0){ pen += .12; warns.push("Leva anos até virar renda"); }
    else if(p.ent === "medio" && R.prazo === 0){ pen += .04; }
    if(p.inv >= 3 && R.grana === 0){ pen += .1; warns.push("Pede investimento"); }
    else if(p.inv === 2 && R.grana === 0){ pen += .04; }
    if(long && R.horas === 0){ pen += .05; }
    if(p.renda === "variavel" && R.renda === 0){ pen += .05; warns.push("Renda variável no começo"); }
    if(p.ent === "curto" && (R.prazo === 0 || R.prazo === 1)) plus.push("Começa rápido");
    if(p.inv <= 1 && R.grana !== undefined && R.grana <= 1) plus.push("Pouco investimento");
    const total = 0.6 * ri + 0.3 * val + 0.1 - pen;
    const aff = Math.max(18, Math.min(97, Math.round(total * 100)));
    const typesHit = Object.keys(p.rx).filter(t => code.includes(t) && p.rx[t] >= 2)
      .sort((a, b) => code.indexOf(a) - code.indexOf(b)).slice(0, 2);
    const LADO = {R:"Lado mão na massa", I:"Lado curioso", A:"Lado criativo", S:"Lado cuidador", E:"Lado realizador", C:"Lado organizado"};
    const reasons = typesHit.map(t => LADO[t])
      .concat(match.slice(0, 2).map(d => DIMS[d])).concat(plus.slice(0, 1)).slice(0, 4);
    return {p, total, aff, reasons, warns};
  });
}

  L.push("O que pesa para mim: " + chosenDims().map(d => DIMS[d]).join(", "));
  L.push("", "Minha realidade:");
  REAL.forEach(r => { if(S.real[r.k] !== undefined) L.push(`- ${r.q} ${r.o[S.real[r.k]]}`); });
  L.push("", "Caminhos com mais afinidade:");
  list.forEach((r, k) => L.push(`${k + 1}. ${r.p.nome} (${r.aff}%)`));
  L.push("", "Vou testar: " + S.picks.map(id => PATHS.find(p => p.id === id).nome).join(", "));
  if(S.picks.some(id => S.sc[id])) L.push("Placar: " + matrixTotals().map(x => `${PATHS.find(p => p.id === x.id).nome} ${x.sum}/20`).join(", "));
  const rf = REFL.map((q, k) => [q, S.refl[k].trim()]).filter(x => x[1]);
  if(rf.length){ L.push("", "Reflexões:"); rf.forEach(([q, a]) => L.push(`- ${q}`, `  ${short && a.length > 280 ? a.slice(0, 277) + "..." : a}`)); }
  return L.join("\n");
}
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
let redoArmed = false;
function resAction(a, b){
  if(a === "pick"){
    const id = b.dataset.id, k = S.picks.indexOf(id);
    if(k >= 0){
      if(S.picks.length === 1){ toast("Deixe pelo menos um caminho para testar."); return; }
      S.picks.splice(k, 1);
    } else {
      if(S.picks.length >= 3){ toast("No máximo 3 de uma vez. Desmarque um antes."); return; }
      S.picks.push(id);
    }
    save();
    // Redesenha mantendo abertas as partes que a pessoa tinha aberto.
    const open = [...app.querySelectorAll("details[open][id]")].map(d => d.id);
    const y = window.scrollY; renderRes();
    open.forEach(id => { const d = document.getElementById(id); if(d) d.open = true; });
    window.scrollTo(0, y);
    toast(k >= 0 ? "Removido do plano" : "Adicionado ao plano de 30 dias");
  } else if(a === "copy"){
    const txt = summaryText();
    const fallback = () => { const ta = document.getElementById("copybox"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast("Selecione e copie o texto abaixo"); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Resumo copiado"), fallback);
      else fallback();
    }catch(err){ fallback(); }
  } else if(a === "toshare"){
    const s = document.getElementById("sharesec"); if(s) s.scrollIntoView({behavior:"smooth", block:"start"});
  } else if(a === "shareimg"){
    shareImage();
  } else if(a === "saveimg"){
    saveImage();
  } else if(a === "pdf"){
    openForPrint(); window.print();
  } else if(a === "review"){
    go("int", 0);
  } else if(a === "redo"){
    if(!redoArmed){ redoArmed = true; b.textContent = "Toque de novo para apagar tudo"; setTimeout(() => { redoArmed = false; const r = document.getElementById("redo"); if(r) r.textContent = "Refazer do zero"; }, 4000); }
    else { redoArmed = false; const nm = S.name; S = fresh(); S.name = nm; go("int", 0); }
  }
}
function resInput(e){
  const t = e.target;
  if(t.dataset.task){
    S.done[t.dataset.task] = t.checked; save();
    const l = t.closest(".task"); if(l) l.classList.toggle("ok", t.checked);
  } else if(t.dataset.sc){
    const id = t.dataset.sc, k = +t.dataset.k;
    const sc = S.sc[id] || [3,3,3,3]; sc[k] = +t.value; S.sc[id] = sc; save();
    const o = document.getElementById(`o-${id}-${k}`); if(o) o.textContent = t.value;
    updateMatrix();
  }
}

/* ---------- Imagem para compartilhar (stories, 1080×1920) ---------- */
/* Cores fixas do tema claro: a imagem sai igual em qualquer aparelho. Só mostra código, perfil e 3 caminhos. */
const SC = {bg:"#EDF2EC", paper:"#F9FBF7", ink:"#15241E", muted:"#56675E", line:"#C9D5CB", accent:"#1D6A4F", accentInk:"#F6FBF8",
  marker:"#D5960A", markerSoft:"#F7E6B8", markerInk:"#3D2A00", contour:"rgba(29,106,79,.16)"};
const SC_T = {R:"#A65A2A", I:"#2C5D9C", A:"#A93C83", S:"#2A8664", E:"#B07804", C:"#5A55A0"};
const F_D = '"Big Shoulders Display","Arial Narrow",sans-serif';
const F_B = '"Atkinson Hyperlegible",system-ui,sans-serif';
const F_M = '"IBM Plex Mono",ui-monospace,monospace';
const CAN_SHARE_FILES = (() => {
  try{ return !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(["x"])], "a.png", {type:"image/png"})]})); }
  catch(e){ return false; }
})();
let shareImg = {key:"", blob:null, url:"", name:""};

function siteUrl(){ const l = document.querySelector('link[rel="canonical"]'); return l ? l.href : location.href.split("#")[0]; }
function shareData(){
  const pct = typeScores();
  return {name:S.name, code:codeOf(pct), pct, top:ranked().slice(0, 3).map(r => ({nome:r.p.nome, aff:r.aff}))};
}
function fontsReady(){
  if(!document.fonts || !document.fonts.load) return Promise.resolve();
  return Promise.all([`800 100px ${F_D}`, `700 40px ${F_B}`, `400 40px ${F_B}`, `600 30px ${F_M}`, `500 30px ${F_M}`]
    .map(f => document.fonts.load(f).catch(() => {})));
}
// Diminui a fonte até o texto caber na largura.
function fitText(c, text, weight, fam, size, min, maxW){
  let s = size;
  for(;;){ c.font = `${weight} ${s}px ${fam}`; if(s <= min || c.measureText(text).width <= maxW) return s; s -= 2; }
}
function track(c, px){ if("letterSpacing" in c) c.letterSpacing = px + "px"; }
function rrect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawShare(c, d){
  const W = 1080, H = 1920, M = 96, CW = W - 2 * M;
  c.fillStyle = SC.bg; c.fillRect(0, 0, W, H);
  // Curvas de nível e bandeira no cume
  const cx = W * 0.8, cy = 160, step = 62;
  c.strokeStyle = SC.contour;
  for(let k = 1; k <= 38; k++){
    c.lineWidth = k % 5 === 0 ? 4 : 2;
    c.beginPath();
    for(let s = 0; s <= 220; s++){
      const a = s / 220 * Math.PI * 2;
      const wob = 1 + 0.13 * Math.sin(3 * a + k * 0.55) + 0.07 * Math.sin(5 * a - k * 0.35) + 0.04 * Math.cos(7 * a + k * 0.9);
      const x = cx + Math.cos(a) * k * step * wob * 1.3, y = cy + Math.sin(a) * k * step * wob * 0.85;
      s ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.stroke();
  }
  c.strokeStyle = SC.marker; c.fillStyle = SC.marker; c.lineWidth = 8; c.lineCap = "round";
  c.beginPath(); c.moveTo(cx, cy + 44); c.lineTo(cx, cy - 76); c.stroke();
  c.beginPath(); c.moveTo(cx, cy - 76); c.lineTo(cx + 66, cy - 52); c.lineTo(cx, cy - 28); c.closePath(); c.fill();
  c.beginPath(); c.arc(cx, cy + 44, 11, 0, Math.PI * 2); c.fill();

  c.textAlign = "left"; c.textBaseline = "alphabetic";
  // Rótulo
  const label = n => ((n ? n + " · " : "") + "Meu código de interesses").toUpperCase();
  track(c, 5); c.fillStyle = SC.muted;
  let nm0 = (d.name || "").trim(), kick = label(nm0);
  if(fitText(c, kick, 600, F_M, 32, 24, CW) <= 24 && c.measureText(kick).width > CW){
    nm0 = nm0.split(/\s+/)[0]; kick = label(nm0);
    while(nm0.length > 1 && fitText(c, kick, 600, F_M, 32, 24, CW) <= 24 && c.measureText(kick).width > CW){ nm0 = nm0.slice(0, -1); kick = label(nm0 + "…"); }
  }
  c.fillText(kick, M, 290);
  track(c, 0);
  // Código de 3 letras
  let x = M - 6;
  d.code.forEach((t, k) => {
    if(k){ c.font = `800 120px ${F_D}`; c.fillStyle = SC.line; x += 18; c.fillText("·", x, 505); x += c.measureText("·").width + 18; }
    c.font = `800 300px ${F_D}`; c.fillStyle = SC_T[t]; c.fillText(t, x, 555); x += c.measureText(t).width;
  });
  const names = d.code.map(t => TYPES[t].nome).join(" · ");
  c.fillStyle = SC.ink; fitText(c, names, 700, F_B, 50, 30, CW); c.fillText(names, M, 632);

  // Cartão com perfil e caminhos
  const PX = 64, PW = W - 128, PY = 680, PH = 790, IX = PX + 48, IW = PW - 96;
  c.fillStyle = SC.paper; rrect(c, PX, PY, PW, PH, 36); c.fill();
  c.strokeStyle = SC.line; c.lineWidth = 3; c.stroke();
  [...TORDER].sort((a, b) => d.pct[b] - d.pct[a]).forEach((t, k) => {
    const y = PY + 82 + k * 58, bx = IX + 280, bw = IW - 280 - 100;
    c.fillStyle = SC.ink; fitText(c, TYPES[t].nome, 700, F_B, 34, 26, 262); c.fillText(TYPES[t].nome, IX, y);
    c.fillStyle = SC.line; rrect(c, bx, y - 24, bw, 22, 11); c.fill();
    if(d.pct[t] > 0){ c.fillStyle = SC_T[t]; rrect(c, bx, y - 24, Math.max(22, bw * d.pct[t] / 100), 22, 11); c.fill(); }
    c.font = `600 30px ${F_M}`; c.fillStyle = SC.ink; c.textAlign = "right"; c.fillText(d.pct[t] + "%", IX + IW, y); c.textAlign = "left";
  });
  const dy = PY + 82 + 5 * 58 + 44;
  c.strokeStyle = SC.line; c.lineWidth = 2; c.beginPath(); c.moveTo(IX, dy); c.lineTo(IX + IW, dy); c.stroke();
  track(c, 4); c.fillStyle = SC.muted; c.font = `600 28px ${F_M}`; c.fillText("CAMINHOS COM MAIS AFINIDADE", IX, dy + 62); track(c, 0);
  const pathW = IW - 56 - 160;
  const pathSize = Math.min(...d.top.map(p => fitText(c, p.nome.toUpperCase(), 800, F_D, 62, 34, pathW)));
  d.top.forEach((p, k) => {
    const y = dy + 146 + k * 90;
    c.fillStyle = SC.muted; c.font = `600 30px ${F_M}`; c.fillText(String(k + 1), IX, y);
    const nm = p.nome.toUpperCase();
    c.fillStyle = SC.ink; c.font = `800 ${pathSize}px ${F_D}`; c.fillText(nm, IX + 56, y);
    const pw = 136, ph = 56, px = IX + IW - pw;
    c.fillStyle = SC.markerSoft; rrect(c, px, y - 42, pw, ph, 28); c.fill();
    c.fillStyle = SC.markerInk; c.font = `600 30px ${F_M}`; c.textAlign = "center"; c.fillText(p.aff + "%", px + pw / 2, y - 3); c.textAlign = "left";
  });

  // Chamada para fazer o teste
  const CY = PY + PH + 30, CH = 150;
  c.fillStyle = SC.accent; rrect(c, PX, CY, PW, CH, 30); c.fill();
  c.fillStyle = SC.accentInk; c.textAlign = "center";
  c.font = `700 50px ${F_B}`; c.fillText("Descubra o seu rumo", W / 2, CY + 68);
  const url = siteUrl().replace(/^https?:\/\//, "").replace(/\/$/, "");
  c.globalAlpha = 0.85; fitText(c, url, 500, F_M, 30, 18, PW - 80); c.fillText(url, W / 2, CY + 118); c.globalAlpha = 1;
  c.textAlign = "left";
}
async function buildShare(d){
  await fontsReady();
  const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1920;
  drawShare(cv.getContext("2d"), d);
  return new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error("toBlob")), "image/png"));
}
// Cria a imagem assim que o resultado aparece, para o toque em "Compartilhar" abrir o menu na hora.
function prepShare(){
  if(!document.getElementById("shareprev")) return;
  const d = shareData(), key = JSON.stringify(d);
  const show = () => { const im = document.getElementById("shareprev"); if(im && shareImg.key === key){ im.src = shareImg.url; im.alt = "Prévia da imagem do seu resultado"; } };
  if(shareImg.key === key && shareImg.url){ show(); return; }
  buildShare(d).then(blob => {
    if(shareImg.url) URL.revokeObjectURL(shareImg.url);
    shareImg = {key, blob, url:URL.createObjectURL(blob), name:`meu-rumo-${d.code.join("")}.png`};
    show();
  }).catch(() => { const s = document.getElementById("sharesec"); if(s) s.hidden = true; });
}
function saveImage(){
  if(!shareImg.blob){ toast("A imagem ainda está sendo criada"); return; }
  const a = document.createElement("a"); a.href = shareImg.url; a.download = shareImg.name;
  document.body.appendChild(a); a.click(); a.remove();
  toast("Imagem baixada");
}
function shareImage(){
  if(!shareImg.blob){ toast("A imagem ainda está sendo criada"); return; }
  let file = null;
  try{ file = new File([shareImg.blob], shareImg.name, {type:"image/png"}); }catch(e){}
  // Só o arquivo, sem texto: no iPhone, mandar texto junto esconde o Instagram do menu.
  if(file && CAN_SHARE_FILES && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err => { if(!err || err.name !== "AbortError") saveImage(); });
  } else saveImage();
}

/* ---------- PDF / impressão ---------- */
// Abre "Como testar em 30 dias" dos 6 primeiros caminhos para sair no papel; fecha de novo depois.
let printOpened = [];
function openForPrint(){
  if(S.step !== "res") return;
  app.querySelectorAll(".path details:not([open])").forEach(d => { d.open = true; printOpened.push(d); });
}
window.addEventListener("beforeprint", openForPrint);
window.addEventListener("afterprint", () => { printOpened.forEach(d => { d.open = false; }); printOpened = []; });

/* ---------- Relevo (curvas de nível) ---------- */
function drawTopo(cv, summit){
  if(!cv) return;
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext("2d"); if(!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  const cs = getComputedStyle(document.documentElement);
  const col = cs.getPropertyValue("--contour").trim() || "rgba(29,106,79,.17)";
  const mark = cs.getPropertyValue("--marker").trim() || "#D5960A";
  const W = r.width, H = r.height, cx = W * 0.84, cy = H * 0.22, step = Math.max(W, H) * 0.055;
  ctx.strokeStyle = col;
  for(let k = 1; k <= 18; k++){
    ctx.lineWidth = k % 5 === 0 ? 2.2 : 1.1;
    ctx.beginPath();
    for(let s = 0; s <= 140; s++){
      const a = s / 140 * Math.PI * 2;
      const wob = 1 + 0.13 * Math.sin(3 * a + k * 0.55) + 0.07 * Math.sin(5 * a - k * 0.35) + 0.04 * Math.cos(7 * a + k * 0.9);
      const x = cx + Math.cos(a) * k * step * wob * 1.3, y = cy + Math.sin(a) * k * step * wob * 0.85;
      s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  if(summit){
    ctx.strokeStyle = mark; ctx.fillStyle = mark; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, cy + 14); ctx.lineTo(cx, cy - 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - 22); ctx.lineTo(cx + 20, cy - 15); ctx.lineTo(cx, cy - 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + 14, 3.5, 0, Math.PI * 2); ctx.fill();
  }
}
function redrawTopo(){ const cv = document.getElementById("topo"); if(cv) drawTopo(cv, S.step === "res"); }
let rzT;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(redrawTopo, 120); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawTopo); }catch(e){}
try{ new MutationObserver(redrawTopo).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]}); }catch(e){}

/* ---------- Início ---------- */
function render(){
  renderTop();
  switch(S.step){
    case "int": renderInt(); break;
    case "par": renderPar(); break;
    case "real": renderReal(); break;
    case "refl": renderRefl(); break;
    case "res": renderRes(); break;
    default: renderIntro();
  }
  if(S.step !== "intro" && S.step !== "res"){
    const q = document.getElementById("qq");
    if(q){ try{ q.focus({preventScroll:true}); }catch(e){} }
  }
}
(function init(){
  if(!Array.isArray(S.int) || S.int.length !== ITEMS.length) S.int = Array(ITEMS.length).fill(null);
  if(!Array.isArray(S.par) || S.par.length !== PAIRS.length) S.par = Array(PAIRS.length).fill(null);
  if(!Array.isArray(S.refl) || S.refl.length !== REFL.length) S.refl = Array(REFL.length).fill("");
  if(S.step === "res" && (S.int.includes(null) || S.par.includes(null))) S.step = "intro";
  if(S.step !== "res") S.step = "intro";
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(redrawTopo).catch(() => {});
  render();
})();
